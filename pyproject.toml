[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graphfixture"
version = "0.1.0"
description = "Generate deterministic relational test fixtures from DataHub context."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Alike001" }]
dependencies = [
  "duckdb>=1.2,<2",
]

[project.scripts]
graphfixture = "graphfixture.cli:main"

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphfixture"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=graphfixture",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graphfixture"
version = "0.1.0"
description = "Generate deterministic relational test fixtures from DataHub context."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Alike001" }]
dependencies = [
  "acryl-datahub[datahub-rest]==1.7.0",
  "duckdb>=1.2,<2",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.35,<1",
]

[project.scripts]
graphfixture = "graphfixture.cli:main"

[dependency-groups]
dev = [
  "build>=1.2",
  "httpx2>=2,<3",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphfixture"]

[tool.hatch.build.targets.sdist]
include = [
  "/examples",
  "/src",
  "/tests",
  "/.python-version",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=graphfixture",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
